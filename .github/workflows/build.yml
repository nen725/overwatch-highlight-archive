name: Windows build
on:
  push:
    branches: [main]
    tags:                        
      - "v*"
  pull_request:
  workflow_dispatch:
permissions:
  contents: write                
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run pack        
        env:                     
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-x64
          path: release/*.exe
          if-no-files-found: error
          
